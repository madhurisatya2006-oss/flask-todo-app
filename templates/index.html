<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Todo App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="text-center mb-4">
        <h1 class="fw-bold">My Todo App</h1>
        <p class="text-muted">Stay organized and get things done.</p>
    </div>

    <div class="card shadow-sm p-4">

        <form action="/add" method="POST" class="d-flex mb-4">

            <input type="text"
                   name="task"
                   class="form-control me-2"
                   placeholder="Enter a new task..."
                   required>

            <button class="btn btn-primary">
                Add
            </button>

        </form>

        <h5 class="mb-3">My Tasks</h5>

        {% for task in tasks %}

        <div class="d-flex justify-content-between align-items-center
                    border rounded p-3 mb-2">

            <div>
                {% if task["completed"] %}
                    <span class="text-decoration-line-through text-muted">
                        {{ task["task"] }}
                    </span>
                {% else %}
                    <span>
                        {{ task["task"] }}
                    </span>
                {% endif %}
            </div>

            <div>

                {% if not task["completed"] %}
                <a href="/complete/{{ task['id'] }}"
                   class="btn btn-success btn-sm">
                    Complete
                </a>
                {% endif %}

                <a href="/delete/{{ task['id'] }}"
                   class="btn btn-danger btn-sm">
                    Delete
                </a>

            </div>

        </div>

        {% else %}

        <p class="text-center text-muted">
            No tasks yet. Add your first task!
        </p>

        {% endfor %}

    </div>

</div>

</body>
</html>
